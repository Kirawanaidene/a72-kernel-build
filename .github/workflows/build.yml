# =====================================================================
#  目标：复刻 OPPO A72 5G (PDYM20 / MT6853) 的【原生内核】并导出 System.map
#  用途：算出 GhostLock / 月虹工具需要的 9 个内核符号偏移
#
#  与社区项目 (sanba0519) 的关键区别：
#    1) 不打任何 KSU / ReSukiSU / SUSFS 补丁 —— 保持代码与原厂一致
#    2) 使用设备导出的 .config (kernel_dot_config) —— 即真机 /proc/config.gz
#    3) KBUILD_BUILD_USER / HOST 设为原厂值 —— 影响 .rodata 布局，必须一致
#    4) 额外导出 out/System.map 与 out/vmlinux（原项目只打包 Image）
#
#  放置位置：仓库根目录 .github/workflows/Build Stock Kernel.yml
#  依赖文件：仓库根目录需有 kernel_dot_config（手机导出的 .config）
# =====================================================================

name: Build Stock Kernel (System.map)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ---------- 磁盘扩容（内核编译很吃空间） ----------
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h

      # ---------- 基础依赖 ----------
      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo -E apt-get -y -qq install git make bc bison ccache openssl \
            dos2unix zip kmod cpio flex libelf-dev curl libssl-dev libtfm-dev \
            wget device-tree-compiler ca-certificates python3 binutils \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace

      # ---------- GCC 4.9（与原厂同代，取自 android-12.1.0_r27） ----------
      - name: Download GCC toolchain
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          mkdir gcc64 gcc32
          wget -q -O gcc-aarch64.tar.gz \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          tar -C gcc64/ -zxf gcc-aarch64.tar.gz
          wget -q -O gcc-arm.tar.gz \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          tar -C gcc32/ -zxf gcc-arm.tar.gz

      # ---------- Clang 6443078：与手机 /proc/version 报告的版本号完全一致 ----------
      - name: Download Clang 6443078
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone -q --depth=1 \
            https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078 \
            -b 10.0 clang-aosp
          $GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin/clang --version | head -2

      # ---------- 内核源码 ----------
      # 注：OPPO 官方仓库 oppo-source/android_kernel_4.14_oppo_mtk5g 只含其改动部分，
      #     缺 kernel/sched_assist/Kconfig 等文件，无法编译（已实测 olddefconfig 失败）。
      #     改用社区补全树：whjddzyx/android12 是该系列最干净的（未做 KSU/BPF 改造），
      #     hzf1878 等多个 fork 均指向同一 commit。
      - name: Clone kernel source (community-complete tree)
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone --depth=1 -b android12 \
            https://github.com/whjddzyx/android_kernel_oppo_mtk6853.git \
            android-kernel
          cd android-kernel && git log -1 --oneline

      # ---------- 用真机 .config 编译（零补丁、原厂 BUILD_USER/HOST） ----------
      - name: Configure and build stock kernel
        run: |
          # 注意：内核源码树位于仓库的 4.14.186/ 子目录，不是仓库根目录
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel/4.14.186
          export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          # 这两个值必须与原厂一致，否则 /proc/version 文本长度变化会影响 .rodata 布局
          export KBUILD_BUILD_USER=root
          export KBUILD_BUILD_HOST=kvm-slave-build-s-vendor-06579691

          mkdir -p out
          cp $GITHUB_WORKSPACE/kernel_dot_config out/.config
          make -j"$(nproc)" O=out ARCH=arm64 olddefconfig

          make -j"$(nproc)" O=out ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LD=ld.lld

          echo "==== 产物清单 ===="
          ls -lh out/System.map out/vmlinux out/arch/arm64/boot/Image* 2>&1 || true

      # ---------- 先自检：产物不存在就直接失败，避免"空包" ----------
      - name: Verify products exist
        run: |
          OUT="$GITHUB_WORKSPACE/kernel_workspace/android-kernel/4.14.186/out"
          for f in "$OUT/System.map" "$OUT/vmlinux" "$OUT/arch/arm64/boot/Image"; do
            if [ ! -s "$f" ]; then echo "MISSING: $f"; exit 1; fi
            echo "OK: $(ls -lh "$f")"
          done

      # ---------- 导出符号表（本次改造：只上传 System.map，约 10MB，避免 482MB 大包下载失败） ----------
      # 注意：make 是用 O=out 在 4.14.186/ 目录下执行的，
      #       所以产物在 .../android-kernel/4.14.186/out/，路径必须带 4.14.186
      - name: Upload System.map only
        uses: actions/upload-artifact@v4
        with:
          name: stock-systemmap
          if-no-files-found: error
          path: |
            kernel_workspace/android-kernel/4.14.186/out/System.map
