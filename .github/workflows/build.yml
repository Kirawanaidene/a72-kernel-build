# =====================================================================
#  OPPO A72 5G (PDYM20 / MT6853) —— 复刻原厂 F.43 内核，导出 System.map
#
#  Run#5：在 Run#4 基础上修正 4 个「已定位的产物与原厂不一致」原因
#    1) 摘除 KernelSU —— Run#4 产物含 191 个 ksu_* 符号 / 139 条 kernelsu 串，原厂 0
#    2) olddefconfig 必须看到真实 clang —— 否则 Kconfig 用宿主 gcc 探测，
#       LTO 能力门被误关（Run#4 实测 5 项 LTO 配置被改成 n → 代码生成完全不同）
#    3) 版本串必须带 "+"，构建机/时间戳必须与原厂逐字节一致
#    4) 关掉会被树内默认值误开的 3 项连接性配置（BT / MTK_COMBO_BT / MTK_COMBO_COMM）
#
#  验收标准（本地比对，CI 里没有原厂镜像）：
#    - Image 大小必须 = 48,736,256 字节
#    - 横幅必须 = Linux version 4.14.186+ (root@kvm-slave-build-s-vendor-06579691)
#                 (Android (6443078 based on r383902) clang version 11.0.1 ...)
#                 #1 SMP PREEMPT Fri Sep 12 17:01:57 CST 2025
#    - System.map 里 ksu_* / kernelsu 必须 = 0
# =====================================================================

name: Build Stock Kernel (System.map)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ---------- 磁盘扩容 ----------
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h

      # ---------- 基础依赖 ----------
      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo -E apt-get -y -qq install git make bc bison ccache openssl \
            dos2unix zip kmod cpio flex libelf-dev curl libssl-dev libtfm-dev \
            wget device-tree-compiler ca-certificates python3 binutils \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace
          # 配置文件必须在仓库根目录
          test -s $GITHUB_WORKSPACE/kernel_dot_config \
            || { echo "!! 仓库根目录缺少 kernel_dot_config"; exit 1; }

      # ---------- GCC 4.9 ----------
      # Run#6 实测：同一 URL 在 Run#4 成功 / Run#6 失败（wget exit 8 = 服务端错误，7 秒即挂）
      # => 纯网络偶发/限流。修法：① 显式重试 ② git 克隆备源 ③ 失败不阻塞（编译缺 GCC 时会另行报错）
      - name: Download GCC 4.9 toolchain
        continue-on-error: true
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          mkdir -p gcc64 gcc32
          fetch() { # $1=url $2=outfile
            for i in 1 2 3 4 5; do
              echo "-- wget try $i : $2"
              if wget --tries=3 --timeout=120 --retry-connrefused -O "$2" "$1"; then
                # 防下到 HTML 错误页
                if tar -tzf "$2" >/dev/null 2>&1; then echo "OK $2"; return 0; fi
                echo "!! 归档损坏，重试"; rm -f "$2"; sleep 10
              else
                echo "!! wget 失败，重试"; sleep 10
              fi
            done
            return 1
          }
          GCC64=https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          GCC32=https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          fetch "$GCC64" gcc-aarch64.tar.gz && tar -C gcc64/ -zxf gcc-aarch64.tar.gz || echo "!! aarch64 GCC 取不到，尝试 git 备源"
          fetch "$GCC32" gcc-arm.tar.gz     && tar -C gcc32/ -zxf gcc-arm.tar.gz     || echo "!! arm GCC 取不到，尝试 git 备源"
          # 备源：直接 git clone 同一 prebuilts 仓库
          if [ ! -x gcc64/bin/aarch64-linux-android-gcc ]; then
            echo "==== git 备源 aarch64 ===="
            for i in 1 2 3; do
              rm -rf gcc64 && mkdir -p gcc64
              git clone -q --depth=1 -b android-12.1.0_r27 \
                https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
                gcc64 && break || { echo "retry $i"; sleep 10; }
            done
          fi
          if [ ! -x gcc32/bin/arm-linux-androideabi-gcc ]; then
            echo "==== git 备源 arm ===="
            for i in 1 2 3; do
              rm -rf gcc32 && mkdir -p gcc32
              git clone -q --depth=1 -b android-12.1.0_r27 \
                https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
                gcc32 && break || { echo "retry $i"; sleep 10; }
            done
          fi
          echo "==== 工具链到位情况 ===="
          ls -l gcc64/bin/*gcc gcc32/bin/*gcc 2>&1 || echo "!! GCC 仍然缺失（clang 全量构建通常仍可用）"

      # ---------- Clang 6443078（与原厂 /proc/version 完全一致） ----------
      - name: Download Clang 6443078
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          for i in 1 2 3 4 5; do
            rm -rf clang-aosp
            if git clone -q --depth=1 \
              https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078 \
              -b 10.0 clang-aosp; then break; fi
            echo "!! clang clone 失败，重试 $i"; sleep 10
          done
          ./clang-aosp/bin/clang --version | head -2

      # ---------- 内核源码 ----------
      - name: Clone kernel source
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          for i in 1 2 3 4 5; do
            rm -rf android-kernel
            if git clone --depth=1 -b android12 \
              https://github.com/whjddzyx/android_kernel_oppo_mtk6853.git android-kernel; then break; fi
            echo "!! kernel clone 失败，重试 $i"; sleep 10
          done
          cd android-kernel && git log -1 --oneline

      # ---------- 【新增 A】KernelSU 接线侦察（只报告，便于排障） ----------
      - name: Recon KernelSU integration
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel/4.14.186
          echo "==== KSU 目录 ===="
          ls -la KernelSU 2>/dev/null || echo "(无 KernelSU 目录)"
          echo "==== 树内 .patch 文件 ===="
          find . -name '*.patch' -not -path './out/*' 2>/dev/null | head -40 || true
          echo "==== Makefile/Kconfig 中的 KernelSU 引用 ===="
          grep -rn "KernelSU" --include=Makefile --include=Kconfig . 2>/dev/null | head -20 || echo "(无)"
          echo "==== 含 ksu_ 的源文件（前 30） ===="
          grep -rln "ksu_" --include=*.c --include=*.h . 2>/dev/null | head -30 || echo "(无)"

      # ---------- 【新增 B】摘除 KernelSU ----------
      # Run#7 失败复盘：KSU 目录在 ./KernelSU，drivers/kernelsu 是指向 ../KernelSU/kernel 的
      # **符号链接**；`rm -rf KernelSU` 删掉链接目标后，drivers/Kconfig:229 那行小写引用
      #   source "drivers/kernelsu/Kconfig"
      # 找不到文件 -> olddefconfig 直接 Error 2（原 sed 只匹配大写 "KernelSU"，删不到它）。
      # 修法核心：**不靠 sed 猜引用**，改为「掏空源码 + 建空壳桩」，任何残留引用都能解析。
      - name: Strip KernelSU
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel/4.14.186
          echo "==== 摘除前的接线情况 ===="
          ls -ld KernelSU drivers/kernelsu 2>&1 || true
          (readlink drivers/kernelsu && echo "(drivers/kernelsu 是符号链接)") 2>/dev/null || true
          grep -rniE "kernelsu" drivers/Kconfig Makefile 2>/dev/null || true

          # 1) 反向应用 KSU 自带补丁
          if [ -d KernelSU ]; then
            find KernelSU -name '*.patch' 2>/dev/null | while read -r p; do
              echo "revert: $p"
              git apply -R --whitespace=nowarn "$p" 2>/dev/null \
                || echo "  !! 反向应用失败（不致命）: $p"
            done
          fi

          # 2) 删掉把 KSU 编进来的 obj-y / obj-$(CONFIG_KSU) 行（大小写都覆盖）
          for f in $(grep -rliE "kernelsu" --include=Makefile . 2>/dev/null); do
            sed -i -E '/kernelsu/d' "$f" && echo "cleaned Makefile: $f"
          done

          # 3) 删 KSU 源码目录 + 断链
          rm -rf KernelSU
          rm -f drivers/kernelsu

          # 4)【关键】建空壳桩：即便还有引用行残留也能解析成功，且不编进任何东西
          mkdir -p drivers/kernelsu
          printf '# KSU stub (removed by CI)\n' > drivers/kernelsu/Kconfig
          : > drivers/kernelsu/Makefile
          echo "---- 桩已建 ----"; ls -la drivers/kernelsu

          # 5) 残留报告（不硬失败，最终以 System.map 自检为准）
          echo "==== 残留检查 ===="
          R=$(grep -rlniE "ksu_|kernelsu" --include=*.c --include=*.h . 2>/dev/null | head -20 || true)
          if [ -n "$R" ]; then echo "!! C/H 仍有残留："; echo "$R"; else echo "OK: C/H 无残留"; fi

          # 6) 立刻试跑 olddefconfig —— 快速失败，别等编译几十分钟后才发现
          export ARCH=arm64
          export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH
          export CC=clang
          mkdir -p out && cp $GITHUB_WORKSPACE/kernel_dot_config out/.config
          echo "==== 预检 olddefconfig（KSU 摘除后应通过）===="
          make O=out ARCH=arm64 olddefconfig 2>&1 | tail -20

      # ---------- 配置 + 编译 ----------
      - name: Configure and build stock kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel/4.14.186
          export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=root
          export KBUILD_BUILD_HOST=kvm-slave-build-s-vendor-06579691
          export KBUILD_BUILD_TIMESTAMP="Fri Sep 12 17:01:57 CST 2025"
          export CC="clang"
          export LD="ld.lld"
          export AR="llvm-ar"
          export NM="llvm-nm"
          export OBJCOPY="llvm-objcopy"
          export OBJDUMP="llvm-objdump"
          export STRIP="llvm-strip"
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          mkdir -p out
          cp $GITHUB_WORKSPACE/kernel_dot_config out/.config
          make -j"$(nproc)" O=out ARCH=arm64 olddefconfig

          # 关掉原厂为 n、但会被树内默认值误开的 3 项
          ./scripts/config --file out/.config -d BT -d MTK_COMBO_BT -d MTK_COMBO_COMM
          make -j"$(nproc)" O=out ARCH=arm64 olddefconfig

          echo "==== 关键配置自检 ===="
          for k in LTO LTO_CLANG THINTOOLCHAIN THINLTO CFI_CLANG LOCALVERSION LOCALVERSION_AUTO KALLSYMS KALLSYMS_ALL BT MTK_COMBO_BT MTK_COMBO_COMM; do
            printf "  CONFIG_%-18s = " "$k"
            grep -E "^CONFIG_$k=|^# CONFIG_$k is not set" out/.config || echo "<缺>"
          done

          make -j"$(nproc)" O=out ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LD=ld.lld \
            LOCALVERSION=+

          echo "==== 产物清单 ===="
          ls -lh out/System.map out/vmlinux out/arch/arm64/boot/Image* 2>&1 || true
          # 供本地比对的明文配置副本（.config 是隐藏文件，artifact 默认不收）
          cp out/.config out/kernel.config.txt

      # ---------- 自检 ----------
      - name: Verify products
        run: |
          OUT="$GITHUB_WORKSPACE/kernel_workspace/android-kernel/4.14.186/out"
          for f in "$OUT/System.map" "$OUT/vmlinux" "$OUT/arch/arm64/boot/Image"; do
            [ -s "$f" ] || { echo "MISSING: $f"; exit 1; }
            ls -l "$f"
          done

          N=$(grep -c -iE " ksu_|kernelsu" "$OUT/System.map" || true)
          echo "KSU 符号数 = $N （必须为 0）"
          test "$N" -eq 0 || { echo "!! 仍含 KernelSU，偏移不可用"; exit 1; }

          IMG="$OUT/arch/arm64/boot/Image"
          echo "Image 大小 = $(stat -c%s "$IMG")  (原厂 48736256)"
          sha256sum "$IMG"
          echo "==== 内核横幅（应与原厂逐字节一致）===="
          strings -a "$IMG" | grep -m1 "^Linux version" || true

      # ---------- 上传 ----------
      - name: Upload symbols
        uses: actions/upload-artifact@v4
        with:
          name: stock-symbols
          if-no-files-found: error
          compression-level: 6
          path: |
            kernel_workspace/android-kernel/4.14.186/out/System.map
            kernel_workspace/android-kernel/4.14.186/out/kernel.config.txt

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: stock-image
          if-no-files-found: error
          compression-level: 6
          path: kernel_workspace/android-kernel/4.14.186/out/arch/arm64/boot/
