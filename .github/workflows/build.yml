# =====================================================================
#  OPPO A72 5G (PDYM20 / MT6853) —— 复刻原厂 F.43 内核，导出 System.map
#
#  Run#5：在 Run#4 基础上修正 4 个「已定位的产物与原厂不一致」原因
#    1) 摘除 KernelSU —— Run#4 产物含 191 个 ksu_* 符号 / 139 条 kernelsu 串，原厂 0
#    2) olddefconfig 必须看到真实 clang —— 否则 Kconfig 用宿主 gcc 探测，
#       LTO 能力门被误关（Run#4 实测 5 项 LTO 配置被改成 n → 代码生成完全不同）
#    3) 版本串必须带 "+"，构建机/时间戳必须与原厂逐字节一致
#    4) 关掉会被树内默认值误开的 3 项连接性配置（BT / MTK_COMBO_BT / MTK_COMBO_COMM）
#
#  验收标准（本地比对，CI 里没有原厂镜像）：
#    - Image 大小必须 = 48,736,256 字节
#    - 横幅必须 = Linux version 4.14.186+ (root@kvm-slave-build-s-vendor-06579691)
#                 (Android (6443078 based on r383902) clang version 11.0.1 ...)
#                 #1 SMP PREEMPT Fri Sep 12 17:01:57 CST 2025
#    - System.map 里 ksu_* / kernelsu 必须 = 0
# =====================================================================

name: Build Stock Kernel (System.map)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ---------- 磁盘扩容 ----------
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h

      # ---------- 基础依赖 ----------
      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo -E apt-get -y -qq install git make bc bison ccache openssl \
            dos2unix zip kmod cpio flex libelf-dev curl libssl-dev libtfm-dev \
            wget device-tree-compiler ca-certificates python3 binutils \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            dwarves libdw-dev python3-pip gawk
          # BTF needs pahole (4.14 uses pahole, not the 6.x DWARF5 path)
          ( which pahole && pahole --version ) || echo "!! pahole missing (BTF will fail)"
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace
          # 配置文件必须在仓库根目录
          test -s $GITHUB_WORKSPACE/kernel_dot_config \
            || { echo "!! 仓库根目录缺少 kernel_dot_config"; exit 1; }

      # ---------- GCC 4.9 ----------
      # Run#6 实测：同一 URL 在 Run#4 成功 / Run#6 失败（wget exit 8 = 服务端错误，7 秒即挂）
      # => 纯网络偶发/限流。修法：① 显式重试 ② git 克隆备源 ③ 失败不阻塞（编译缺 GCC 时会另行报错）
      - name: Download GCC 4.9 toolchain
        continue-on-error: true
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          mkdir -p gcc64 gcc32
          fetch() { # $1=url $2=outfile
            for i in 1 2 3 4 5; do
              echo "-- wget try $i : $2"
              if wget --tries=3 --timeout=120 --retry-connrefused -O "$2" "$1"; then
                # 防下到 HTML 错误页
                if tar -tzf "$2" >/dev/null 2>&1; then echo "OK $2"; return 0; fi
                echo "!! 归档损坏，重试"; rm -f "$2"; sleep 10
              else
                echo "!! wget 失败，重试"; sleep 10
              fi
            done
            return 1
          }
          GCC64=https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          GCC32=https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          fetch "$GCC64" gcc-aarch64.tar.gz && tar -C gcc64/ -zxf gcc-aarch64.tar.gz || echo "!! aarch64 GCC 取不到，尝试 git 备源"
          fetch "$GCC32" gcc-arm.tar.gz     && tar -C gcc32/ -zxf gcc-arm.tar.gz     || echo "!! arm GCC 取不到，尝试 git 备源"
          # 备源：直接 git clone 同一 prebuilts 仓库
          if [ ! -x gcc64/bin/aarch64-linux-android-gcc ]; then
            echo "==== git 备源 aarch64 ===="
            for i in 1 2 3; do
              rm -rf gcc64 && mkdir -p gcc64
              git clone -q --depth=1 -b android-12.1.0_r27 \
                https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
                gcc64 && break || { echo "retry $i"; sleep 10; }
            done
          fi
          if [ ! -x gcc32/bin/arm-linux-androideabi-gcc ]; then
            echo "==== git 备源 arm ===="
            for i in 1 2 3; do
              rm -rf gcc32 && mkdir -p gcc32
              git clone -q --depth=1 -b android-12.1.0_r27 \
                https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
                gcc32 && break || { echo "retry $i"; sleep 10; }
            done
          fi
          echo "==== 工具链到位情况 ===="
          ls -l gcc64/bin/*gcc gcc32/bin/*gcc 2>&1 || echo "!! GCC 仍然缺失（clang 全量构建通常仍可用）"

      # ---------- Clang 6443078（与原厂 /proc/version 完全一致） ----------
      - name: Download Clang 6443078
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          for i in 1 2 3 4 5; do
            rm -rf clang-aosp
            if git clone -q --depth=1 \
              https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078 \
              -b 10.0 clang-aosp; then break; fi
            echo "!! clang clone 失败，重试 $i"; sleep 10
          done
          ./clang-aosp/bin/clang --version | head -2

      # ---------- 内核源码 ----------
      - name: Clone kernel source
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          for i in 1 2 3 4 5; do
            rm -rf android-kernel
            if git clone --depth=1 -b android12 \
              https://github.com/Winkmoon/oppo_kernel_mt6885-mt6853-clean.git android-kernel; then break; fi
            echo "!! kernel clone 失败，重试 $i"; sleep 10
          done
          cd android-kernel && git log -1 --oneline

      - name: Configure and build stock kernel
        continue-on-error: true
        run: |
          # ★★★ 必须在【第一步】就关掉 errexit。
          #    Run#18 教训：exfat 改名脚本放在第 170 行、set +e 在第 215 行，
          #    脚本 exit 2（自检发现残留）时整个步骤被 bash -e 立即终止，
          #    out/ 目录都还没建 → 3 分钟空跑，什么都没产出。
          set +e
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=root
          export KBUILD_BUILD_HOST=kvm-slave-build-s-vendor-06579691
          export KBUILD_BUILD_TIMESTAMP="Fri Sep 12 17:01:57 CST 2025"
          export CC="clang"
          export LD="ld.lld"
          export AR="llvm-ar"
          export NM="llvm-nm"
          export OBJCOPY="llvm-objcopy"
          export OBJDUMP="llvm-objdump"
          export STRIP="llvm-strip"
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH="$HOME/.local/bin:$PATH"

          # ★★★ 修 Run#16 的链接失败：duplicate symbol: buf_lock
          # 证据（build.log:6019-6021）：
          #   ld.lld: error: duplicate symbol: buf_lock
          #   >>> defined at exfat_cache.c:703  fs/exfat/exfat_cache.o
          #   >>> defined at stp_uart.c  drivers/misc/mediatek/connectivity/.../stp_uart.o
          # 原因：exfat 的 `void buf_lock(struct super_block*, u32)` 是【函数】，
          #      MTK stp_uart.c 的 `spinlock_t buf_lock;` 是【全局变量】，
          #      两者都进了 built-in.o → 链接器撞名。
          # ★★★ Run#16/#17 两次失败与最终修法
          # Run#16: ld.lld: error: duplicate symbol: buf_lock
          #    exfat_cache.c:596  `void buf_lock(struct super_block*, u32)`  ← 函数
          #    .../linux/stp_uart.c:119  `spinlock_t buf_lock;`              ← 全局变量
          # Run#17: 批量 static 后 → "static declaration of 'exfat_bitmap_test'
          #         follows non-static declaration"（头文件用 TAB 对齐，sed 漏了）
          #
          # ★ 本地分析结论：buf_lock 等 48 个 exfat 函数是【跨文件共享】的
          #   （exfat_cache.c 定义 + exfat_core.c 调用）→ 加 static 会破坏编译。
          #   正确做法是【改名】加 exfat_ 前缀，保留全局可见性。
          echo "==== 修 exfat 符号撞名（改名加 exfat_ 前缀）===="
          cp -f $GITHUB_WORKSPACE/fs_exfat_rename.py ./fs_exfat_rename.py 2>/dev/null || true
          python3 fs_exfat_rename.py || echo "!! 改名脚本返回非 0，继续编译（看后面链接错误）"
          echo "---- 改名后检查 ----"
          grep -n "exfat_buf_lock" fs/exfat/exfat_cache.c | head -3
          grep -n "buf_lock" fs/exfat/exfat_cache.c fs/exfat/exfat_cache.h | head -3 || echo "  (原 buf_lock 已全部改名)"
          echo "---- 导出函数应保持不变 ----"
          grep -nE "^(static )?int FsMountVol" fs/exfat/exfat_api.c | head -2

          mkdir -p out
          cp $GITHUB_WORKSPACE/kernel_dot_config out/.config
          make -j"$(nproc)" O=out ARCH=arm64 olddefconfig

          # ★★ 4.14 的两个硬约束（本地源码树已核实）：
          #  1) DEBUG_INFO_BTF 在 4.14 的 Kconfig 里【不存在】（BTF 是 5.15+ 才有）
          #     lib/Kconfig.debug 里搜不到 DEBUG_INFO_BTF，scripts/Makefile 里没有 pahole
          #     → 用 -e DEBUG_INFO_BTF 是无效的，写进去也会被 olddefconfig 清掉
          #  2) ★★ 修正 Run#20 的错误判断 ★★
          #     我之前说「4.14 的 LTO 需要 LLVMgold 插件、树里没有」——【错了】。
          #     实测 Makefile:1349-1357：
          #       ifdef CONFIG_LTO_CLANG
          #         ifneq ($(call clang-ifversion, -ge, 0500, y), y) ... exit 1
          #         ifneq ($(ld-name),lld)                       ← 用 lld 就跳过 gold 检查
          #           ifneq ($(call gold-ifversion, -ge, 112000000, y), y) ... exit 1
          #     而原厂 config 本来就是 LTO=y / LTO_CLANG=y / CFI_CLANG=y / THINLTO=y。
          #     我把它们全关掉 → 代码生成方式变了 → Image 与原厂差 -1,028,080 字节。
          #     ★ Image header 的 code0 差正好 0x80000（512KB），就是 LTO 布局差异。
          #  所以：只改 KALLSYMS_ALL（目标），其余【全部保持原厂】。
          #  ★★ Run#22 新增：THINLTO 也是原厂配置，必须显式打开 ★★
          #  实测对照（Run#19无LTO / Run#21 full LTO / 原厂）：
          #      Image 47,708,176 / 56,909,840 / 48,736,256
          #    full LTO 让 .text 膨胀 +9.2MB，符号全体后移 ~9.1MB。
          #  而 Makefile:908-913 显示 CONFIG_THINLTO 决定 -flto=thin 还是 -flto：
          #      ifdef CONFIG_THINLTO
          #        lto-clang-flags := -flto=thin      ← ThinLTO，体积接近非 LTO
          #      else
          #        lto-clang-flags := -flto           ← full LTO，体积大
          #  原厂 config 明确写着 CONFIG_THINLTO=y → 必定是 ThinLTO。
          ./scripts/config --file out/.config -e KALLSYMS_ALL -e THINLTO
          make -j"$(nproc)" O=out ARCH=arm64 olddefconfig
          # olddefconfig 可能重置，再确认一次
          ./scripts/config --file out/.config -e KALLSYMS_ALL -e THINLTO
          make -j"$(nproc)" O=out ARCH=arm64 olddefconfig

          # 探针：确认 LTO/THINLTO 保持原厂状态（这是同源性的关键）
          for k in LTO LTO_CLANG THINLTO CFI_CLANG; do
            printf "  CONFIG_%-14s = " "$k"
            grep -E "^CONFIG_$k=|^# CONFIG_$k is not set" out/.config || echo "<无>"
          done

          echo "==== 关键配置自检 ===="
          for k in LTO LTO_CLANG LTO_CLANG_THIN THINTOOLCHAIN CFI_CLANG LOCALVERSION LOCALVERSION_AUTO KALLSYMS KALLSYMS_ALL DEBUG_INFO DEBUG_INFO_DWARF4 BT MTK_COMBO_BT MTK_COMBO_COMM; do
            printf "  CONFIG_%-18s = " "$k"
            grep -E "^CONFIG_$k=|^# CONFIG_$k is not set" out/.config || echo "<缺>"
          done

          # ★ 这棵树的 Makefile 里 `PHONY := _all` 且 `_all:` 是空目标，
          #   所以不带 target 的 make 什么都不会编（只跑 prepare 就退出）。
          #   必须显式指定 all (= vmlinux)。
          # ★ GitHub Actions 默认跑 `bash -e`，make 非 0 会直接终止整个步骤，
          #   导致后面的报告代码块永不执行（Run#14/#15 都因此丢了报告）。
          #   所以整段先关掉 -e，捕获退出码后再继续。
          set +e
          set -o pipefail
          make -j"$(nproc)" O=out ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LD=ld.lld \
            LOCALVERSION=+ \
            all > build.log 2>&1
          RC=$?
          echo "==== make 退出码 = $RC ===="
          echo "==== build.log 行数 = $(wc -l < build.log 2>/dev/null || echo 0) ===="
          echo "==== build.log 最后 60 行 ===="
          tail -60 build.log 2>/dev/null
          echo "==== 错误行 ===="
          grep -nE "Error [0-9]+|error:|fatal:|No rule to make|undefined reference|Stop\." build.log 2>/dev/null | tail -40 || echo "  (无)"

          echo "==== 产物清单 ===="
          ls -l out/System.map out/vmlinux out/arch/arm64/boot/Image* 2>&1 || true

          # ★ 不依赖 artifact —— 把结果写成明文文件，随仓库提交
          # 注意：每条命令都必须容错，任一失败会毁掉整个 { } 输出
          mkdir -p "$GITHUB_WORKSPACE/build_result"
          R="$GITHUB_WORKSPACE/build_result/report.txt"
          echo "make_exit_code=$RC" > "$R"
          echo "build_log_lines=$(wc -l < build.log 2>/dev/null || echo 0)" >> "$R"
          echo "---- key configs ----" >> "$R"
          for k in KALLSYMS KALLSYMS_ALL DEBUG_INFO DEBUG_INFO_BTF DEBUG_INFO_DWARF4 \
                   MODULES LTO LTO_CLANG THINTOOLCHAIN CFI_CLANG LOCALVERSION \
                   ARM64_VA_BITS PANIC_ON_OOPS; do
            printf "CONFIG_%-22s = " "$k" >> "$R"
            ( grep -E "^CONFIG_$k=|^# CONFIG_$k is not set" out/.config 2>/dev/null || echo "<缺>" ) >> "$R"
          done
          echo "---- products ----" >> "$R"
          ( ls -l out/System.map out/vmlinux out/arch/arm64/boot/Image 2>&1 || true ) >> "$R"
          echo "---- out dir top ----" >> "$R"
          ( ls out/ 2>&1 | head -40 || true ) >> "$R"
          echo "---- boot dir ----" >> "$R"
          ( ls -l out/arch/arm64/boot/ 2>&1 | head -20 || true ) >> "$R"
          echo "---- big files md5 ----" >> "$R"
          ( find out -maxdepth 3 -type f -size +1M 2>/dev/null | head -20 | while read -r f; do
              echo "$(md5sum "$f" 2>/dev/null)"; ls -l "$f" 2>/dev/null
            done ) >> "$R" 2>&1 || true
          echo "---- build.log errors ----" >> "$R"
          ( grep -nE "Error [0-9]+|error:|fatal:|No rule to make|undefined reference|Stop\." build.log 2>/dev/null | tail -40 || echo "  (无)" ) >> "$R"
          echo "---- build.log tail 120 ----" >> "$R"
          ( tail -120 build.log 2>/dev/null || echo "  (无 build.log)" ) >> "$R"
          cp -f build.log "$GITHUB_WORKSPACE/build_result/build.log" 2>/dev/null || true

      # ---------- 自检 ----------
      - name: Collect build diagnostics
        if: always()
        continue-on-error: true
        run: |
          set +e
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel || exit 0
          mkdir -p diag
          cp -f build.log diag/build.log 2>/dev/null || true
          echo "==== build.log 错误行 ====" | tee diag/log.txt
          grep -nE "Error [0-9]+|error:|fatal:|No rule to make|undefined reference" build.log 2>/dev/null | tail -40 | tee -a diag/log.txt || echo "  (无)" | tee -a diag/log.txt
          echo "==== out 目录内容 ====" | tee -a diag/log.txt
          ls -la out/ 2>&1 | head -40 | tee -a diag/log.txt
          echo "==== .config 关键项 ====" | tee -a diag/log.txt
          for k in KALLSYMS KALLSYMS_ALL DEBUG_INFO DEBUG_INFO_BTF DEBUG_INFO_DWARF4 \
                   LTO LTO_CLANG THINTOOLCHAIN CFI_CLANG LOCALVERSION \
                   BT MTK_COMBO_BT MTK_COMBO_COMM SECURITY_APPARMOR \
                   SECURITYFS KVM ARM64_VA_BITS PANIC_ON_OOPS; do
            printf "  CONFIG_%-24s = " "$k" | tee -a diag/log.txt
            (grep -E "^CONFIG_$k=|^# CONFIG_$k is not set" out/.config 2>/dev/null || echo "<缺>") | tee -a diag/log.txt
          done
          echo "==== 产物 ====" | tee -a diag/log.txt
          ls -l out/System.map out/vmlinux out/arch/arm64/boot/Image 2>&1 | tee -a diag/log.txt
          if [ -f out/vmlinux ]; then
            echo "==== vmlinux 段（看 BTF/符号）====" | tee -a diag/log.txt
            llvm-readelf -S out/vmlinux 2>/dev/null | grep -iE "btf|debug_info|symtab" | tee -a diag/log.txt ||               readelf -S out/vmlinux 2>/dev/null | grep -iE "btf|debug_info|symtab" | tee -a diag/log.txt
          fi
          echo "==== PAHOLD ====" | tee -a diag/log.txt
          ( which pahole && pahole --version ) 2>&1 | tee -a diag/log.txt
          echo "==== 与仓库原厂 config 的差异（olddefconfig 改了什么）====" | tee -a diag/log.txt
          if [ -f out/.config ] && [ -f "$GITHUB_WORKSPACE/kernel_dot_config" ]; then
            diff <(sort "$GITHUB_WORKSPACE/kernel_dot_config") <(sort out/.config) 2>&1 \
              | head -80 | tee -a diag/log.txt
            echo "==== 差异行数 ====" | tee -a diag/log.txt
            diff <(sort "$GITHUB_WORKSPACE/kernel_dot_config") <(sort out/.config) 2>&1 \
              | grep -c '^[<>]' | tee -a diag/log.txt
          fi
          tail -100 diag/log.txt
          # 同时写进 job summary，便于不下载 artifact 也能直接看到
          {
            echo "## Build diagnostics"
            echo '```'
            cat diag/log.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-diag
          path: $GITHUB_WORKSPACE/kernel_workspace/android-kernel/diag
          if-no-files-found: warn
          retention-days: 30

      # ---------- 最可靠通道：把报告提交回仓库 ----------
      - name: Extract struct offsets from DWARF
        if: always()
        continue-on-error: true
        run: |
          set +e
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          OUTDIR="$GITHUB_WORKSPACE/build_result"
          mkdir -p "$OUTDIR"
          R="$OUTDIR/struct_offsets.txt"
          : > "$R"
          if [ ! -s out/vmlinux ]; then
            echo "!! 无 out/vmlinux" | tee -a "$R"
          else
            ls -l out/vmlinux | tee -a "$R"
            echo "---- vmlinux 段表（确认 .debug_info 存在）----" | tee -a "$R"
            ( llvm-readelf -S out/vmlinux 2>/dev/null || readelf -S out/vmlinux 2>/dev/null ) \
              | grep -iE "debug_info|debug_line|symtab|\.text|\.bss" | tee -a "$R"
            echo "---- struct selinux_state 成员偏移 ----" | tee -a "$R"
            # pahole -C selinux_state vmlinux  最直接
            ( which pahole >/dev/null 2>&1 && pahole -C selinux_state out/vmlinux ) 2>&1 | tee -a "$R"
            echo "---- 全部 struct（含 task_struct/cred/rt_waiter_node）----" | tee -a "$R"
            for s in selinux_state task_struct cred rt_waiter_node rt_mutex_waiter file mm_struct; do
              echo "### $s" | tee -a "$R"
              ( which pahole >/dev/null 2>&1 && pahole -C "$s" out/vmlinux ) 2>&1 | tee -a "$R"
            done
            echo "---- readelf 备用方案：debug_info 里搜 selinux_state ----" | tee -a "$R"
            ( llvm-readelf --debug-dump=info out/vmlinux 2>/dev/null || readelf --debug-dump=info out/vmlinux 2>/dev/null ) \
              | grep -A 60 "DW_AT_name.*: selinux_state" | head -80 | tee -a "$R"
          fi
          wc -l "$R"

      - name: Commit report to repo
        if: always()
        continue-on-error: true
        run: |
          set +e
          cd $GITHUB_WORKSPACE
          mkdir -p build_result
          # 把 diag 也合并进 build_result（artifact 通道不可靠，git 更稳）
          cp -f kernel_workspace/android-kernel/diag/log.txt build_result/diag_log.txt 2>/dev/null || true
          cp -f kernel_workspace/android-kernel/diag/build.log build_result/diag_build.log 2>/dev/null || true

          git config user.email "ci@local"
          git config user.name "CI Bot"
          git add -f build_result 2>/dev/null || true
          # 大产物（>5MB）用 md5 代替，不入库
          if [ -d kernel_workspace/android-kernel/out ]; then
            OUT=kernel_workspace/android-kernel/out
            mkdir -p build_result
            for f in "$OUT/arch/arm64/boot/Image" "$OUT/System.map"; do
              if [ -s "$f" ]; then
                cp "$f" build_result/ 2>/dev/null || true
              fi
            done
            # ★ vmlinux 含 DWARF 约 100~200MB，绝不能入 git（会超限/超时）。
            #   只记大小与 md5；结构体成员偏移已由上一��用 pahole 提取到
            #   build_result/struct_offsets.txt
            if [ -s "$OUT/vmlinux" ]; then
              { ls -l "$OUT/vmlinux"; md5sum "$OUT/vmlinux"; } > build_result/vmlinux_size.txt 2>/dev/null || true
            fi
            [ -s "$OUT/.config" ] && cp "$OUT/.config" build_result/kernel.config.txt || true
            git add -f build_result
          fi
          git commit -q -m "ci: build report ($(date +%s))" || echo "(no changes)"
          git push origin HEAD:${{ github.ref_name }} || echo "push failed (fork/branch protection?)"

      - name: Verify products
        if: always()
        continue-on-error: true
        run: |
          OUT="$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out"
          for f in "$OUT/System.map" "$OUT/vmlinux" "$OUT/arch/arm64/boot/Image"; do
            if [ -s "$f" ]; then ls -l "$f"; else echo "MISSING: $f"; fi
          done

          if [ -s "$OUT/System.map" ]; then
            N=$(grep -c -iE " ksu_|kernelsu" "$OUT/System.map" || true)
            echo "KSU 符号数 = $N （必须为 0）"
          fi

          echo "==== Image size check ==="
          IMG="$OUT/arch/arm64/boot/Image"
          SZ=$(stat -c%s "$IMG")
          echo "  built = $SZ   factory = 48736256"
          if [ "$SZ" -eq 48736256 ]; then echo "  EXACT MATCH"
          elif [ "$SZ" -lt 50000000 ]; then echo "  IN RANGE (likely same-source)"
          else echo "  TOO BIG (Run#8=52013072) - source may differ"; fi

          echo "==== 9 target data symbols ==="
          for s in init_task init_cred root_task_group security_hook_heads selinux_enforcing selinux_blob_sizes loggers nfulnl_logger sysctl_bootid; do
            printf "  %-24s " "$s"
            grep -E " [bBdDrR] $s" "$OUT/System.map" | head -1 || echo "MISSING"
          done

          echo "==== BTF symbols ==="
          grep -E "__start_BTF|__stop_BTF" "$OUT/System.map" || echo "  NO BTF"

          IMG="$OUT/arch/arm64/boot/Image"
          if [ -s "$IMG" ]; then
            echo "Image 大小 = $(stat -c%s "$IMG")  (原厂 48736256)"
            sha256sum "$IMG"
            echo "==== 内核横幅 ===="
            strings -a "$IMG" | grep -m1 "^Linux version" || true
          fi
          exit 0

      # ---------- 从 vmlinux 的 DWARF 提取结构体成员偏移 ----------
      # 4.14 没有 BTF（内核树 Kconfig 里就没这个选项），但 CONFIG_DEBUG_INFO=y
      # 保证 vmlinux 里有 .debug_info（DWARF4），结构体成员偏移同样能拿到。
      # 目标：selinux_state.disabled / checkreqprot（= 6.x 的 enforcing 位置）
      # ---------- 上传 ----------
      - name: Upload symbols
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: stock-symbols
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
          path: |
            kernel_workspace/android-kernel/out/System.map
            kernel_workspace/android-kernel/out/kernel.config.txt

      - name: Upload Image
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: stock-image
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
          path: kernel_workspace/android-kernel/out/arch/arm64/boot/
